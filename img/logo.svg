<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="50%" r="80%">
      <stop offset="0%" style="stop-color:#0a0210;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#020008;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFE81F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE81F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E6A800;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="deathStarGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#7a7a7a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#404040;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#181818;stop-opacity:1"/>
    </radialGradient>
    <filter id="saberGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="20" fill="url(#bgGrad)"/>
  <!-- Gold border -->
  <rect width="600" height="200" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Stars (warm tone) -->
  <circle cx="15"  cy="12"  r="1"   fill="#fffde0" opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="42"  cy="28"  r="0.8" fill="white"   opacity="0.7"/>
  <circle cx="58"  cy="8"   r="1.2" fill="white"   opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="88"  cy="18"  r="0.7" fill="white"   opacity="0.6"/>
  <circle cx="110" cy="5"   r="1"   fill="#fffde0" opacity="0.8"/>
  <circle cx="135" cy="22"  r="0.6" fill="white"   opacity="0.7"/>
  <circle cx="170" cy="10"  r="1.1" fill="white"   opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="200" cy="18"  r="0.8" fill="white"   opacity="0.6"/>
  <circle cx="235" cy="6"   r="1"   fill="#fff9c4" opacity="0.8"/>
  <circle cx="280" cy="14"  r="0.7" fill="white"   opacity="0.7"/>
  <circle cx="320" cy="8"   r="1.2" fill="white"   opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="355" cy="20"  r="0.8" fill="#fffde0" opacity="0.7"/>
  <circle cx="390" cy="5"   r="1"   fill="white"   opacity="0.8"/>
  <circle cx="430" cy="15"  r="0.6" fill="white"   opacity="0.6"/>
  <circle cx="460" cy="9"   r="1.1" fill="#fff9c4" opacity="0.8" filter="url(#starGlow)"/>
  <circle cx="495" cy="22"  r="0.7" fill="white"   opacity="0.7"/>
  <circle cx="525" cy="7"   r="1"   fill="white"   opacity="0.9"/>
  <circle cx="560" cy="18"  r="0.8" fill="#fffde0" opacity="0.7"/>
  <circle cx="585" cy="10"  r="1.2" fill="white"   opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="22"  cy="170" r="0.8" fill="white"   opacity="0.6"/>
  <circle cx="50"  cy="185" r="1"   fill="#fffde0" opacity="0.8"/>
  <circle cx="75"  cy="175" r="0.6" fill="white"   opacity="0.7"/>
  <circle cx="210" cy="180" r="0.9" fill="white"   opacity="0.7"/>
  <circle cx="450" cy="178" r="1"   fill="#fff9c4" opacity="0.8"/>
  <circle cx="510" cy="190" r="0.7" fill="white"   opacity="0.6"/>
  <circle cx="545" cy="175" r="1.1" fill="white"   opacity="0.8" filter="url(#starGlow)"/>
  <circle cx="580" cy="185" r="0.8" fill="#fffde0" opacity="0.7"/>

  <!-- ===== DEATH STAR ===== -->
  <circle cx="78" cy="100" r="50" fill="url(#deathStarGrad)"/>
  <!-- Panel line vertical -->
  <line x1="78" y1="50" x2="78" y2="150" stroke="#555" stroke-width="0.7" opacity="0.4"/>
  <!-- Equatorial trench -->
  <rect x="29" y="96.5" width="98" height="7" rx="1.5" fill="#090909" opacity="0.95"/>
  <line x1="29" y1="98.5" x2="127" y2="98.5" stroke="#3a3a3a" stroke-width="0.5"/>
  <line x1="29" y1="101.5" x2="127" y2="101.5" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- Superlaser dish -->
  <circle cx="60" cy="80" r="20" fill="#303030" stroke="#505050" stroke-width="1"/>
  <circle cx="60" cy="80" r="13" fill="#252525" stroke="#404040" stroke-width="0.8"/>
  <circle cx="60" cy="80" r="7"  fill="#181818"/>
  <circle cx="60" cy="80" r="3"  fill="#0d0d0d" stroke="#555" stroke-width="0.5"/>
  <!-- Superlaser lens glow (subtle green) -->
  <circle cx="60" cy="80" r="3" fill="#00ff88" opacity="0.15" filter="url(#saberGlow)"/>
  <!-- Surface panel blocks -->
  <rect x="88"  y="55"  width="10" height="5" rx="1" fill="#303030" opacity="0.9"/>
  <rect x="100" y="63"  width="8"  height="4" rx="1" fill="#2a2a2a" opacity="0.8"/>
  <rect x="105" y="78"  width="9"  height="4" rx="1" fill="#303030" opacity="0.7"/>
  <rect x="100" y="119" width="10" height="5" rx="1" fill="#303030" opacity="0.8"/>
  <rect x="88"  y="132" width="10" height="5" rx="1" fill="#2a2a2a" opacity="0.9"/>
  <!-- Subtle gold rim -->
  <circle cx="78" cy="100" r="50" fill="none" stroke="#FFE81F" stroke-width="0.8" opacity="0.12"/>

  <!-- ===== CROSSED LIGHTSABERS ===== -->
  <!-- Blades drawn before hilts so hilts sit on top -->

  <!-- Blue saber: (136,148) → (178,44), crossing at ~(158,93) -->
  <line x1="136" y1="148" x2="178" y2="44" stroke="#3399FF" stroke-width="4.5" stroke-linecap="round" filter="url(#saberGlow)" opacity="0.9"/>
  <line x1="136" y1="148" x2="178" y2="44" stroke="#BBDDFF" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Red saber: (180,148) → (138,44), crossing same point -->
  <line x1="180" y1="148" x2="138" y2="44" stroke="#FF2222" stroke-width="4.5" stroke-linecap="round" filter="url(#saberGlow)" opacity="0.9"/>
  <line x1="180" y1="148" x2="138" y2="44" stroke="#FF9999" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Blue hilt (blade leans right going up → hilt tilts left below base) -->
  <rect x="131" y="148" width="10" height="22" rx="3" fill="#888888" transform="rotate(-22 136 148)"/>
  <rect x="132.5" y="150" width="7" height="3"   rx="1" fill="#aaaaaa" transform="rotate(-22 136 148)"/>
  <rect x="132.5" y="155" width="7" height="2.5" rx="1" fill="#666666" transform="rotate(-22 136 148)"/>
  <rect x="132.5" y="161" width="7" height="6"   rx="2" fill="#555555" transform="rotate(-22 136 148)"/>

  <!-- Red hilt (blade leans left going up → hilt tilts right below base) -->
  <rect x="175" y="148" width="10" height="22" rx="3" fill="#777777" transform="rotate(22 180 148)"/>
  <rect x="176.5" y="150" width="7" height="3"   rx="1" fill="#999999" transform="rotate(22 180 148)"/>
  <rect x="176.5" y="155" width="7" height="2.5" rx="1" fill="#555555" transform="rotate(22 180 148)"/>
  <rect x="176.5" y="161" width="7" height="6"   rx="2" fill="#444444" transform="rotate(22 180 148)"/>

  <!-- Divider -->
  <line x1="210" y1="35" x2="210" y2="165" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== TEXT ===== -->
  <text x="228" y="68"
        font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
        font-size="27" font-weight="900" font-style="italic"
        fill="url(#textGrad)" letter-spacing="4"
        filter="url(#titleGlow)">JOGO DA</text>

  <text x="228" y="105"
        font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
        font-size="33" font-weight="900" font-style="italic"
        fill="url(#textGrad)" letter-spacing="3"
        filter="url(#titleGlow)">ADIVINHAÇÃO</text>

  <text x="228" y="142"
        font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
        font-size="33" font-weight="900" font-style="italic"
        fill="url(#textGrad)" letter-spacing="3"
        filter="url(#titleGlow)">E MEMÓRIA</text>

  <text x="228" y="163"
        font-family="'Segoe UI', 'Arial', sans-serif"
        font-size="11" font-weight="400" font-style="italic"
        fill="#C8980A" letter-spacing="2.5" opacity="0.9">QUE A FORÇA ESTEJA COM VOCÊ</text>

  <!-- Lightsaber color accent dots -->
  <circle cx="228" cy="178" r="3" fill="#FF2222" opacity="0.95" filter="url(#dotGlow)"/>
  <circle cx="241" cy="178" r="3" fill="#FFE81F" opacity="0.9"  filter="url(#dotGlow)"/>
  <circle cx="254" cy="178" r="3" fill="#3399FF" opacity="0.95" filter="url(#dotGlow)"/>

  <!-- Badges -->
  <rect x="466" y="172" width="42" height="20" rx="5" fill="#150a00" stroke="#FFE81F" stroke-width="1.2"/>
  <text x="487" y="186" font-family="monospace" font-size="11" font-weight="bold"
        fill="#FFE81F" text-anchor="middle">C11</text>

  <rect x="515" y="172" width="56" height="20" rx="5" fill="#05050f" stroke="#6b0bdaff" stroke-width="1.2"/>
  <text x="543" y="186" font-family="monospace" font-size="11" font-weight="bold"
        fill="#6b0bdaff" text-anchor="middle">Raylib</text>

  <!-- Imperial symbol (top-right corner) -->
  <g transform="translate(570, 48)" opacity="0.55">
    <circle cx="0" cy="0" r="14"  fill="none" stroke="#FFE81F" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6.5" fill="none" stroke="#FFE81F" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2"   fill="#FFE81F"/>
    <line x1="0"    y1="-14"  x2="0"    y2="-6.5" stroke="#FFE81F" stroke-width="1.5"/>
    <line x1="0"    y1="6.5"  x2="0"    y2="14"   stroke="#FFE81F" stroke-width="1.5"/>
    <line x1="-14"  y1="0"    x2="-6.5" y2="0"    stroke="#FFE81F" stroke-width="1.5"/>
    <line x1="6.5"  y1="0"    x2="14"   y2="0"    stroke="#FFE81F" stroke-width="1.5"/>
    <line x1="-9.9" y1="-9.9" x2="-4.6" y2="-4.6" stroke="#FFE81F" stroke-width="1.5"/>
    <line x1="4.6"  y1="4.6"  x2="9.9"  y2="9.9"  stroke="#FFE81F" stroke-width="1.5"/>
    <line x1="9.9"  y1="-9.9" x2="4.6"  y2="-4.6" stroke="#FFE81F" stroke-width="1.5"/>
    <line x1="-4.6" y1="4.6"  x2="-9.9" y2="9.9"  stroke="#FFE81F" stroke-width="1.5"/>
  </g>
</svg>
